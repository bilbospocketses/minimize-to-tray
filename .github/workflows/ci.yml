# CI: build smoke on every push to main and every PR targeting main.
#
# This workflow enables the `required_status_checks` rule on the main branch
# ruleset (rule references the `build-and-test` job context). Without this
# workflow existing and running, the rule would block ALL pushes to main
# because the required check would never report.
#
# What this job does:
#   1. Restore dotnet-tools (pins vpk per dotnet-tools.json).
#   2. Run build.ps1, which chains:
#        - Ahk2Exe (vendored under dependencies/) compiles minimize-to-tray.ahk
#        - dotnet publish compiles updater-helper (self-contained single-file)
#        - vpk pack produces the Velopack Setup.exe + .nupkg + Portable.zip
#   3. Upload dist/ as an artifact for inspection.
#
# There's no separate test suite (AHK has no standard test framework that
# justifies the setup cost for a single-file script). The build chain
# itself is the smoke: if vpk pack succeeds, all three sub-steps succeeded.
#
# All actions are SHA-pinned per the repo-level `sha_pinning_required`
# enforcement. Trailing `# vX.Y.Z` comments are PRECISE (never bare `# v4`)
# so Dependabot's github-actions ecosystem tracks future major bumps
# correctly. SHAs reference COMMIT objects (not annotated-tag objects) per
# the OpenSSF Scorecard / Sigstore "imposter commit" verifier behavior.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025  # explicit pin, not the windows-latest moving alias. GitHub's Jun-2026 migration swaps VS2022->VS2026 under this same label (label stays); build is VS-agnostic (setup-dotnet + vendored Ahk2Exe), so transparent.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The American-spelling gate below diffs from the merge-base with the
          # base branch and refuses a shallow clone.
          fetch-depth: 0

      # American spelling. The cross-repo gate from bilbospocketses/american-spelling
      # scans the lines this branch adds and its commit messages, and fails on a
      # British spelling. It runs first because it is the cheapest gate here.
      #
      # Steps inside build-and-test rather than a job of their own: main's ruleset
      # requires a check named exactly `build-and-test`, so a separate job would
      # not be required and could rot unnoticed.
      #
      # Exceptions are not kept in this repo. A verbatim quote takes the inline
      # `spelling: allow` marker; an identifier used on many lines goes in the
      # gate's central allow.txt, and reaches this repo when the pin is bumped.
      # On a push to main the base is main itself, so there is nothing to scan.
      #
      # These steps use `shell: bash` (Git Bash on the Windows runner) so that
      # `${BASE}` expands and `rm -rf` works; `python` is the runner's own
      # Python 3 (`python3` is not on PATH on Windows), and the gate is stdlib-only.
      - name: Fetch the base branch
        shell: bash
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
      - name: Check out the American-spelling gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bilbospocketses/american-spelling
          ref: 21ed7e5524c511d9ee584778d42b72e6ddaeba86 # v1.0.2
          path: .american-spelling
          persist-credentials: false
      - name: Check American spelling
        shell: bash
        run: >-
          python .american-spelling/check-american-spelling.py
          --repo .
          --base "origin/${BASE}"
          --repo-slug "${SLUG}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          SLUG: ${{ github.repository }}
      - name: Remove the gate checkout
        # Keeps it out of the tree build.ps1 compiles and packages into dist/.
        shell: bash
        run: rm -rf .american-spelling

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Restore dotnet local tools (vpk)
        run: dotnet tool restore

      - name: Build via build.ps1
        shell: pwsh
        run: ./build.ps1

      - name: Upload Velopack artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velopack-bundle
          path: dist/
          retention-days: 14
